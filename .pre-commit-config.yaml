# One guardrail layer for the stars-reborn monorepo. Mirrors the house
# standard (shoestring-wm, moldy, knots).
#   Install:    pre-commit install
#   Run all:    pre-commit run --all-files
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^engine/tests/data/
      - id: end-of-file-fixer
        exclude: ^engine/tests/data/
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048] # allows PNG assets up to 2 MB
      - id: mixed-line-ending
        args: [--fix=lf]

  # Rust: format, lint (deny warnings), test. Local = uses the repo toolchain.
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy -D warnings
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-test
        name: cargo test --workspace
        entry: cargo test --workspace
        language: system
        types: [rust]
        pass_filenames: false

  # Python: lint + format the client. The scripts/ commit-policy guards are
  # kept byte-identical with the maintainer's other repos, so ruff skips them.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff-check
        args: [--fix]
        exclude: &policy-guards ^scripts/(check_|test_check_).*\.py$
      - id: ruff-format
        exclude: *policy-guards

  # moldy: format the neutral formats (JSON/YAML/Markdown) with one tool.
  # Rust/Python stay on rustfmt/ruff for now; migrating them to moldy is a
  # deliberate post-restructure A/B change (see docs/adr/0002).
  - repo: local
    hooks:
      - id: moldy
        name: moldy (JSON/YAML/Markdown)
        entry: moldy --in-place
        language: system
        types_or: [json, yaml, markdown]
        exclude: ^engine/tests/data/
        verbose: true

  # knots complexity gate (rust + python), from the prebuilt-wheel mirror.
  # The default hook ships args [--aird-threshold=85].
  - repo: https://github.com/brandon-arrendondo/knots-pre-commit
    rev: v1.19.0
    hooks:
      - id: knots
        types_or: [rust, python]
        exclude: ^scripts/(check_|test_check_).*\.py$

  # Commit policy (see AGENTS.md): DCO sign-off required, AI attribution
  # trailers rejected. The guard tests cover the check itself.
  - repo: local
    hooks:
      - id: commit-message-policy
        name: DCO sign-off and no AI attribution trailers
        entry: python3 scripts/check_commit_message.py
        language: system
        stages: [commit-msg]
      - id: agent-guard-tests
        name: agent and commit guard regression tests
        entry: python3 -W error::ResourceWarning -m unittest discover -s scripts -p test_check_*.py
        language: system
        pass_filenames: false
        files: ^scripts/(check_|test_check_).*\.py$
