name: CI

# The same checks the local pre-commit hooks run for compiled/typed code
# (Rust fmt + clippy + test, plus a release build; Python lint + format),
# on every push to main and every pull request.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.11 'datamodel-code-generator[ruff]' pydantic jsonschema pytest
      - run: ruff check client
      - run: ruff format --check client
      # Generated types must match the schema source of truth (ADR-0003):
      # regenerate and fail if the committed client types are stale.
      - name: Client types are up to date with schemas/
        run: |
          python3 scripts/generate_types.py
          git diff --exit-code -- client/src/data/generated
      - name: Schema contract tests
        run: python3 -m pytest client/tests -q
